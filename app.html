<html>
    <body>
        <button onclick="add()">Add</button>
        <p id="count">0</p>
    </body>
</html>

<script>
    function add() {
        let p = document.getElementById('count')
        let total = parseInt(p.textContent)
        p.textContent = total += 1
        console.log(p)
       
    }
</script>

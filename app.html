<html>
    <head>
        <title>Cadastro de produtos</title>
    </head>

    <body>
        <div class="container">
            <h3>Cadastro</h3>
            <form onsubmit="getData(event)">
                <label for="produto">Produto</label>
                <input 
                    type="text"
                    name="produto"
                    min="1"
                    required
                />

                <label for="preco">Preço</label>
                <input 
                    type="text"
                    name="preco"
                    min="1"
                    required
                />

                <button type="submit">Adicionar</button>
            </form>

        </div>
        <div id="errorMessage" class="errorMessage"></div>

        <div class="">
            <span id="produtoL"></span>
            <span id="precoL"></span>
        </div>
    </body>

    <script>
        function getData(event) {
            event.preventDefault(); // Impede o formulário de recarregar a página

            let valProduto = document.getElementsByName('produto')[0].value.trim();
            let valPreco = document.getElementsByName('preco')[0].value.trim();
            let message = '';

            if (!valProduto) {
                message = 'O campo produto é obrigatório';
            } else if (!valPreco) {
                message = 'O campo preço é obrigatório';
            }

            if (message) {
                document.getElementById('errorMessage').innerText = message;
            } else {
                document.getElementById('errorMessage').innerText = '';
                document.getElementById('produtoL').innerText = `Produto: ${valProduto}`;
                document.getElementById('precoL').innerText = `Preço: ${valPreco}`;
            }
        }
    </script>
</html>
